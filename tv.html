<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel das Obras · Venko</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  /* Painel das TVs do escritório — layout definido pelo Giovani (TV 1 / TV 2).
     Tudo é medido em "u", que acompanha o tamanho da TV (1920×1080 → u = 19,2px). */
  :root{
    --fundo:#0b0b0b; --cartao:#141414; --borda:#222222; --faixa:#1a1a1a; --faixa-borda:#262626;
    --branco:#ffffff; --cinza:#a3a3a3; --cinza-2:#d4d4d4; --linha:#262626;
    --amarelo:#FFCA00; --verde:#3fbf6a; --vermelho:#e0605a;
    --u:min(1vw, 1.78vh);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--fundo);color:var(--branco);font:500 calc(var(--u)*1)/1.3 Inter, system-ui, sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;}
  body.ocioso, body.ocioso *{cursor:none !important;}
  .n{font-variant-numeric:tabular-nums;}
  .rot{font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--cinza);}

  /* ---------- estrutura ---------- */
  #painel{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:calc(var(--u)*1);padding:calc(var(--u)*1.9);}
  header{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);padding-bottom:calc(var(--u)*.4);}
  .marca{display:flex;align-items:center;gap:calc(var(--u)*1.6);}
  .marca img{height:calc(var(--u)*2.2);display:block;}
  .marca .tv{border-left:1px solid rgba(115,115,115,.6);padding-left:calc(var(--u)*1.4);}
  .marca .tv .rot{font-size:calc(var(--u)*.7);letter-spacing:.14em;}
  .marca .tv b{display:block;font-size:calc(var(--u)*1.4);font-weight:700;letter-spacing:-.01em;line-height:1.15;}
  .relogio{text-align:right;}
  .relogio .hora{font-size:calc(var(--u)*2.5);font-weight:800;letter-spacing:-.02em;line-height:1;}
  .relogio .data{font-size:calc(var(--u)*.83);font-weight:600;color:var(--cinza);letter-spacing:.02em;margin-top:calc(var(--u)*.25);}
  .relogio .data::first-letter{text-transform:uppercase;}
  .estado{font-size:calc(var(--u)*.7);color:#737373;margin-top:calc(var(--u)*.3);display:flex;align-items:center;justify-content:flex-end;gap:calc(var(--u)*.6);}
  .estado .ponto{display:inline-block;width:calc(var(--u)*.5);height:calc(var(--u)*.5);border-radius:50%;background:var(--verde);margin-right:calc(var(--u)*.35);vertical-align:middle;}
  .estado .ponto.off{background:var(--vermelho);}
  .paginas{display:flex;gap:calc(var(--u)*.35);}
  .paginas i{width:calc(var(--u)*.5);height:calc(var(--u)*.5);border-radius:50%;background:#333;}
  .paginas i.on{background:var(--amarelo);}

  #grade{display:grid;gap:calc(var(--u)*1.7);min-height:0;}
  /* rodízio entre as obras (5 min cada) */
  #painel{grid-template-rows:auto minmax(0,1fr) auto;}
  #rodizio{display:flex;align-items:center;gap:calc(var(--u)*1);font-size:calc(var(--u)*.75);color:#737373;font-weight:600;}
  #rodizio[hidden]{display:none !important;}
  .trilho-rod{flex:1;height:calc(var(--u)*.22);background:#1c1c1c;border-radius:999px;overflow:hidden;}
  .trilho-rod i{display:block;height:100%;width:0;background:rgba(255,202,0,.55);border-radius:999px;}
  @keyframes rodizio{from{width:0;}to{width:100%;}}
  .obra.entra{animation:entraObra .6s ease both;}
  @keyframes entraObra{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .obra.entra{animation:none;} }

  /* ---------- cartão da obra ---------- */
  .obra{--k:1;background:var(--cartao);border:1px solid var(--borda);border-radius:calc(var(--u)*1.1);padding:calc(var(--u)*1.7*var(--k));
    display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.6);}
  #grade.u .obra{--k:1.3;}
  #grade.m .obra{--k:.78;}
  .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u)*1.5*var(--k));}
  .topo > div{min-width:0;}
  .nome{font-size:calc(var(--u)*1.67*var(--k));font-weight:900;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topo .rot{display:block;font-size:calc(var(--u)*.76*var(--k));}
  .esq .rot{margin-top:calc(var(--u)*.55*var(--k));}
  .hoje{font-size:calc(var(--u)*2.5*var(--k));font-weight:900;color:var(--amarelo);letter-spacing:-.02em;line-height:1.1;margin-top:calc(var(--u)*.1);white-space:nowrap;}
  .hoje.zero{color:#737373;}
  .obs{font-size:calc(var(--u)*.83*var(--k));color:var(--cinza);font-weight:500;margin-top:calc(var(--u)*.1);}
  .dir{text-align:right;display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;}
  .cli{max-width:calc(var(--u)*20*var(--k));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pct{display:flex;align-items:baseline;gap:calc(var(--u)*.25);margin-top:calc(var(--u)*.25*var(--k));line-height:1;}
  .pct b{font-size:calc(var(--u)*3.33*var(--k));font-weight:900;letter-spacing:-.02em;}
  .pct span{font-size:calc(var(--u)*1.67*var(--k));font-weight:700;color:var(--cinza-2);}
  .pct.batida b{color:var(--verde);}
  .ating{margin-top:calc(var(--u)*.25*var(--k));}
  .ating .rot{font-size:calc(var(--u)*.7*var(--k));}
  .ating b{font-size:calc(var(--u)*1.25*var(--k));font-weight:800;color:var(--amarelo);letter-spacing:-.01em;}

  .faixa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*.85*var(--k));background:rgba(26,26,26,.9);border:1px solid var(--faixa-borda);
    border-radius:calc(var(--u)*.85);padding:calc(var(--u)*.85*var(--k));margin-top:calc(var(--u)*1.1*var(--k));}
  .faixa > div + div{border-left:1px solid #262626;padding-left:calc(var(--u)*.85*var(--k));}
  .faixa .rot{font-size:calc(var(--u)*.63*var(--k));}
  .faixa b{display:block;font-size:calc(var(--u)*1.25*var(--k));font-weight:900;letter-spacing:-.01em;margin-top:calc(var(--u)*.1);white-space:nowrap;}
  .faixa b.am{color:var(--amarelo);}

  .progresso{margin-top:calc(var(--u)*1.1*var(--k));padding-top:calc(var(--u)*.85*var(--k));border-top:1px solid rgba(36,36,36,.6);}
  .progresso .l1{display:flex;justify-content:space-between;gap:calc(var(--u)*1);font-size:calc(var(--u)*.76*var(--k));font-weight:600;color:var(--cinza);margin-bottom:calc(var(--u)*.4*var(--k));}
  .progresso .l1 strong{color:var(--branco);font-weight:700;}
  .progresso .l1 .falta strong{color:var(--cinza-2);}
  .trilho{width:100%;background:#262626;height:calc(var(--u)*.85*var(--k));border-radius:999px;overflow:hidden;padding:calc(var(--u)*.14*var(--k));}
  .trilho i{display:block;height:100%;background:var(--amarelo);border-radius:999px;box-shadow:0 0 12px rgba(255,202,0,.4);transition:width .5s;}
  .trilho i.batida{background:var(--verde);box-shadow:0 0 12px rgba(63,191,106,.4);}
  .progresso .l2{display:flex;justify-content:space-between;font-size:calc(var(--u)*.7*var(--k));color:var(--cinza);font-weight:500;margin-top:calc(var(--u)*.3*var(--k));}
  .progresso .l2 b{color:var(--branco);font-weight:700;}
  .progresso .l2 .meta b{color:var(--cinza-2);}
  .sem-meta{font-size:calc(var(--u)*.83*var(--k));color:var(--cinza);}

  .grafico{margin-top:calc(var(--u)*1.1*var(--k));flex:1;min-height:calc(var(--u)*5);display:flex;flex-direction:column;}
  .grafico .tit{display:flex;justify-content:space-between;font-size:calc(var(--u)*.7*var(--k));margin-bottom:calc(var(--u)*.55*var(--k));}
  /* cada dia é uma coluna: valor do dia em cima, barra, e o número do dia embaixo */
  .barras{flex:1;min-height:0;display:flex;gap:calc(var(--u)*.3*var(--k));padding:0 calc(var(--u)*.25);border-bottom:1px solid #282828;}
  .barras .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;}
  .barras .v{font-size:calc(var(--u)*.6*var(--k));font-weight:700;color:var(--cinza-2);text-align:center;white-space:nowrap;margin-bottom:calc(var(--u)*.2);letter-spacing:-.03em;overflow:visible;}
  #grade.u .barras .v{font-size:calc(var(--u)*.72);}
  .barras .col.hj .v{color:var(--amarelo);}
  .barras .b{border-radius:2px 2px 0 0;background:#2c2c2c;}
  .barras .col.zero .b{background:#1a1a1a;}
  .barras .col.futuro .b{background:rgba(28,28,28,.5);}
  .barras .col.hj .b{background:var(--amarelo);box-shadow:0 0 15px rgba(255,202,0,.5);}
  .eixo{display:flex;gap:calc(var(--u)*.3*var(--k));padding:0 calc(var(--u)*.25);margin-top:calc(var(--u)*.25);}
  .eixo span{flex:1;min-width:0;text-align:center;font-size:calc(var(--u)*.6*var(--k));color:#737373;font-weight:700;font-variant-numeric:tabular-nums;}
  #grade.u .eixo span{font-size:calc(var(--u)*.72);}
  .eixo span.hj{color:var(--amarelo);}
  .eixo span.fds{color:#4a4a4a;}

  .vazio-geral{grid-column:1/-1;display:grid;place-items:center;text-align:center;color:var(--cinza);font-size:calc(var(--u)*1.2);}
  .vazio-geral b{display:block;font-size:calc(var(--u)*2.2);font-weight:900;color:var(--branco);text-transform:uppercase;margin-bottom:calc(var(--u)*.5);}

  /* ---------- menu (aparece ao mexer o mouse) ---------- */
  #menu{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--u)*1.6);display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .25s;}
  body:not(.ocioso) #menu{opacity:1;pointer-events:auto;}
  .bt{font:600 14px Inter,sans-serif;color:var(--branco);background:#1f1f1f;border:1px solid #333;border-radius:10px;padding:9px 14px;cursor:pointer;}
  .bt:hover{border-color:var(--amarelo);}
  .bt:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px;}
  .bt.ouro{background:var(--amarelo);color:#111;border-color:var(--amarelo);}

  /* ---------- entrada ---------- */
  #entrada{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(800px 420px at 15% 10%, rgba(255,202,0,.12), transparent 60%), var(--fundo);}
  #entrada form{width:min(420px,100%);background:var(--cartao);border:1px solid var(--borda);border-radius:20px;padding:34px 30px 28px;display:grid;gap:14px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8);font-size:15px;}
  #entrada img{height:34px;justify-self:start;}
  #entrada h1{font-size:28px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;margin-top:6px;}
  #entrada p{color:var(--cinza);font-size:14px;}
  #entrada label{font:700 11px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);display:block;margin-bottom:6px;}
  #entrada input{width:100%;font:500 16px Inter,sans-serif;color:var(--branco);background:var(--fundo);border:1px solid #2a2a2a;border-radius:10px;padding:11px 12px;user-select:text;}
  #entrada input:focus{outline:none;border-color:var(--amarelo);box-shadow:0 0 0 3px rgba(255,202,0,.25);}
  .escolha-tv{display:flex;gap:8px;}
  .escolha-tv button{flex:1;}
  .escolha-tv button[aria-pressed="true"]{background:var(--amarelo);color:#111;border-color:var(--amarelo);}
  #erro{color:#F08A84;font-size:14px;min-height:1em;}
  #entrada .bt.ouro{padding:12px;font-size:15px;}
  /* ---------- vincular esta TV (código) ---------- */
  #vincular{position:fixed;inset:0;display:grid;place-items:center;padding:calc(var(--u)*2);text-align:center;
    background:radial-gradient(60vw 50vh at 50% 0%, rgba(255,202,0,.10), transparent 70%), var(--fundo);}
  #vincular .caixa{display:grid;justify-items:center;gap:calc(var(--u)*1.2);max-width:calc(var(--u)*60);}
  #vincular img{height:calc(var(--u)*2.6);}
  #vincular h1{font-size:calc(var(--u)*2.2);font-weight:900;letter-spacing:.02em;text-transform:uppercase;margin-top:calc(var(--u)*.8);}
  #vincular .codigo{font-size:calc(var(--u)*7.5);font-weight:900;letter-spacing:.12em;color:var(--amarelo);line-height:1;padding:calc(var(--u)*1.2) calc(var(--u)*2.4);
    border:2px solid rgba(255,202,0,.35);border-radius:calc(var(--u)*1.4);background:rgba(255,202,0,.05);font-variant-numeric:tabular-nums;white-space:nowrap;}
  #vincular .passo{font-size:calc(var(--u)*1.25);color:var(--cinza-2);line-height:1.5;}
  #vincular .passo b{color:var(--branco);}
  #vincular .mini{font-size:calc(var(--u)*.85);color:#737373;}
  #vincular .bt{font-size:14px;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){ .trilho i{transition:none;} }
</style>
</head>
<body>

<div id="vincular" hidden>
  <div class="caixa">
    <img data-logo alt="Venko">
    <h1>Vincular esta TV</h1>
    <div class="codigo" id="codigoTv">······</div>
    <p class="passo">No computador, abra o sistema RDO ▸ <b>Obras</b> ▸ <b>📺 Vincular TV</b><br>e digite o código acima.</p>
    <p class="mini" id="vincularInfo">O código troca sozinho a cada 10 minutos.</p>
    <button class="bt" type="button" id="btUsarSenha">Entrar com usuário e senha</button>
  </div>
</div>

<div id="entrada" hidden>
  <form id="formEntrada" autocomplete="on">
    <img data-logo alt="Venko">
    <h1>Painel das obras</h1>
    <p>Entre com a conta da TV. Ela fica conectada nesta tela — não precisa entrar de novo.</p>
    <div><label for="login">Usuário</label><input id="login" name="username" autocomplete="username" required></div>
    <div><label for="senha">Senha</label><input id="senha" name="password" type="password" autocomplete="current-password" required></div>
    <div><label>Esta tela é a</label><div class="escolha-tv" id="escolhaTv"></div></div>
    <div id="erro" role="alert"></div>
    <button class="bt ouro" type="submit" id="btEntrar">Entrar</button>
    <button class="bt" type="button" id="btUsarCodigo">Vincular com código (sem senha)</button>
  </form>
</div>

<div id="painel" hidden>
  <header>
    <div class="marca">
      <img data-logo alt="Venko">
      <div class="tv"><span class="rot">Painel das obras</span><b id="tvNome">TV 1</b></div>
    </div>
    <div class="relogio">
      <div class="hora n" id="hora">--:--</div>
      <div class="data" id="data"></div>
      <div class="estado"><div class="paginas" id="paginas"></div><span id="status"><span class="ponto"></span>Carregando…</span></div>
    </div>
  </header>
  <main id="grade"></main>
  <div id="rodizio" hidden><div class="trilho-rod"><i id="rodizioBarra"></i></div><span id="rodizioTxt"></span></div>
</div>

<div id="menu" hidden>
  <button class="bt" type="button" id="btTela">Tela cheia</button>
  <button class="bt" type="button" id="btTroca">Trocar para TV 2</button>
  <button class="bt" type="button" id="btSair">Sair</button>
</div>

  function buscar(){

        if(!res.data || !res.data.vinculada){ modoAparelho = false; mostraVincular(); return; }   // desvinculada no sistema

        '</div>'+
        '<div class="dir">'+
          '<span class="rot cli">'+esc(o.cliente || '')+'</span>'+
          '<div class="pct'+(batida?' batida':'')+'"><b class="n">'+(pct==null ? '—' : pct)+'</b>'+(pct==null ? '' : '<span>%</span>')+'</div>'+
          '<div class="ating"><span class="rot">Valor atingido</span><b class="n">'+reais(mes)+'</b></div>'+
        '</div>'+
      '</div>'+
      '<div class="faixa">'+
        '<div><div class="rot">Total hoje</div><b class="n">'+reais(hoje)+'</b></div>'+
        '<div><div class="rot">Total do mês</div><b class="n">'+reais(mes)+'</b></div>'+
        '<div><div class="rot">Meta do mês</div><b class="n am">'+(meta>0 ? reais(meta) : '—')+'</b></div>'+
      '</div>'+
      '<div class="progresso">'+
        (meta > 0
          ? '<div class="l1"><span>PROGRESSO DA META: <strong>'+pct+'%</strong></span><span class="falta">'+(batida ? '<strong>META BATIDA</strong>' : 'FALTAM: <strong>'+reais(meta - mes)+'</strong>')+'</span></div>'+
            '<div class="trilho" role="img" aria-label="'+pct+'% da meta"><i class="'+(batida?'batida':'')+'" style="width:'+Math.min(100, mes/meta*100).toFixed(1)+'%"></i></div>'+
            '<div class="l2"><span>Atingido: <b>'+reais(mes)+'</b></span><span class="meta">Meta: <b>'+reais(meta)+'</b></span></div>'
          : '<div class="sem-meta">Meta do mês não definida — no sistema, em Obras, preencha “Previsto do mês R$”.</div>')+
      '</div>'+
      '<div class="grafico">'+
        '<div class="tit rot"><span>Dia a dia — '+MESES[mesN-1]+'</span><span>Maior dia '+reais(maior)+'</span></div>'+
        '<div class="barras">'+barras+'</div>'+
        '<div class="eixo">'+eixo+'</div>'+
      '</div>'+
    '</section>';
  }

  // ---------- tela sempre acesa, tela cheia, cursor ----------
  var trava = null;
  function pedeTelaAcesa(){
    try{ if('wakeLock' in navigator && !trava) navigator.wakeLock.request('screen').then(function(l){ trava = l; l.addEventListener('release', function(){ trava = null; }); }, function(){}); }catch(e){}
  }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && !$('painel').hidden){ pedeTelaAcesa(); buscar(); } });
  var ocioso = null;
  function acorda(){ document.body.classList.remove('ocioso'); clearTimeout(ocioso); ocioso = setTimeout(function(){ document.body.classList.add('ocioso'); }, 3000); }
  ['mousemove','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, acorda, {passive:true}); });
  acorda();
  $('btTela').addEventListener('click', function(){
    if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  });
  document.addEventListener('fullscreenchange', function(){ $('btTela').textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia'; });
  $('btTroca').addEventListener('click', function(){ tv = tv % TVS + 1; guarda.set('vk_tv', String(tv)); pagina = 0; dados = null; iniciaPainel(); });
  $('btSair').addEventListener('click', function(){ sb.auth.signOut().then(function(){ mostraEntrada(''); }); });

  // recarrega a página a cada 6 horas (pega versões novas e evita a TV ficar lenta)
  setTimeout(function(){ location.reload(); }, 6 * 60 * 60 * 1000);
  relogio(); setInterval(relogio, 5000);

  // ---------- vincular esta TV com código ----------
  function pararVinculo(){ clearInterval(timerVinc); clearInterval(timerCodigo); timerVinc = timerCodigo = null; }
  function pedirCodigo(){
    hashHex(chaveTv).then(function(h){ return sb.rpc('vk_tv_pedir_codigo', { p_token_hash: h }); }).then(function(res){
      if(res.error){ $('codigoTv').textContent = '······'; $('vincularInfo').textContent = 'Não foi possível gerar o código (' + res.error.message + '). Tentando de novo…'; return; }
      var c = String(res.data || ''); $('codigoTv').textContent = c.slice(0,3) + '-' + c.slice(3);
      $('vincularInfo').textContent = 'O código troca sozinho a cada 10 minutos.';
    }, function(){ $('vincularInfo').textContent = 'Sem conexão com a internet. Tentando de novo…'; });
  }
  function conferirVinculo(){
    sb.rpc('vk_painel_tv_aparelho', { p_token: chaveTv }).then(function(res){
      if(res && !res.error && res.data && res.data.vinculada){ modoAparelho = true; tv = res.data.tv || tv; guarda.set('vk_tv', String(tv)); iniciaPainel(); }
    }, function(){});
  }
  function mostraVincular(){
    pararTimers(); pararVinculo();
    if(!chaveTv){ chaveTv = novaChave(); guarda.set('vk_tv_chave', chaveTv); }
    $('painel').hidden = true; $('menu').hidden = true; $('entrada').hidden = true; $('vincular').hidden = false;
    pedirCodigo(); timerCodigo = setInterval(pedirCodigo, 9 * 60 * 1000);
    timerVinc = setInterval(conferirVinculo, 4000);
  }
  $('btUsarSenha').addEventListener('click', function(){ mostraEntrada(''); });
  $('btUsarCodigo').addEventListener('click', function(){ mostraVincular(); });

  if(!sb){ mostraEntrada('Configuração do sistema não encontrada.'); return; }
  // 1º) TV já vinculada por código → painel direto; 2º) alguém logado → painel; 3º) senão, mostra o código
  (chaveTv ? sb.rpc('vk_painel_tv_aparelho', { p_token: chaveTv }) : Promise.resolve(null)).then(function(res){
    if(res && !res.error && res.data && res.data.vinculada){ modoAparelho = true; tv = res.data.tv || tv; iniciaPainel(); return; }
    return sb.auth.getSession().then(function(r){ if(r && r.data && r.data.session) iniciaPainel(); else mostraVincular(); });
  }).catch(function(){ mostraVincular(); });
})();
</script>
</body>
</html>
