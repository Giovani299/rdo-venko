<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel das Obras · Venko</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0F0D">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  /* Painel das TVs do escritório — feito para ser lido de longe (tela escura, números grandes). */
  :root{
    --chao:#0F0F0D; --placa:#191916; --placa-2:#211F1B; --linha:#2E2C27;
    --tinta:#F2F0E9; --tinta-2:#C9C6BB; --aco:#8F8D86;
    --ouro:#EEC512; --ouro-2:#F7DE4E; --ouro-fundo:rgba(238,197,18,.12);
    --ok:#46B970; --alerta:#E0605A;
    --u:min(1vw, 1.78vh);           /* unidade que escala com a TV (1920×1080 → 19,2px) */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--chao);color:var(--tinta);font:500 calc(var(--u)*1) / 1.35 Inter, system-ui, sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
  body.ocioso, body.ocioso *{cursor:none !important;}
  .num{font-family:"Big Shoulders Display", Impact, sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
  .rot{font:700 calc(var(--u)*.78)/1.2 Inter, sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--aco);}

  /* ---------- estrutura ---------- */
  #painel{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.6) calc(var(--u)*2);
    background:radial-gradient(90vw 50vh at 50% -20vh, rgba(238,197,18,.07), transparent 70%), var(--chao);}
  header{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);}
  .marca{display:flex;align-items:center;gap:calc(var(--u)*1.4);}
  .marca img{height:calc(var(--u)*2.4);}
  .marca .tv{display:flex;flex-direction:column;border-left:1px solid var(--linha);padding-left:calc(var(--u)*1.4);}
  .marca .tv b{font:800 calc(var(--u)*1.9)/1 "Big Shoulders Display", sans-serif;letter-spacing:.04em;text-transform:uppercase;}
  .relogio{text-align:right;}
  .relogio .hora{font-size:calc(var(--u)*3.4);font-weight:800;line-height:.9;}
  .relogio .data{color:var(--tinta-2);font-size:calc(var(--u)*1.05);margin-top:calc(var(--u)*.3);}
  .relogio .data::first-letter{text-transform:uppercase;}

  #grade{display:grid;gap:calc(var(--u)*1.2);min-height:0;}
  .obra{--k:1;overflow:hidden;background:linear-gradient(180deg,var(--placa-2),var(--placa));border:1px solid var(--linha);border-radius:calc(var(--u)*1.1);
    padding:calc(var(--u)*1.4*var(--k)) calc(var(--u)*1.6*var(--k));display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:calc(var(--u)*1.1*var(--k));min-height:0;min-width:0;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 30px 60px -40px rgba(0,0,0,.9);animation:entra .5s ease both;}
  @keyframes entra{from{opacity:.001;transform:translateY(8px);}to{opacity:1;transform:none;}}
  #grade.m .obra{--k:.8;} #grade.p .obra{--k:.64;}
  .obra-topo{min-width:0;}
  .obra-nome{font:800 calc(var(--u)*2.1*var(--k))/1.02 "Big Shoulders Display", sans-serif;text-transform:uppercase;letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .obra-cli{color:var(--aco);font-size:calc(var(--u)*.95*max(var(--k),.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:calc(var(--u)*.2);}

  .numeros{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:calc(var(--u)*1.6*var(--k));align-items:end;}
  .hoje .valor{white-space:nowrap;font-size:calc(var(--u)*4.4*var(--k));font-weight:800;line-height:.95;margin-top:calc(var(--u)*.35);color:var(--ouro-2);}
  .hoje .valor.zero{color:var(--aco);}
  .hoje .obs{color:var(--tinta-2);font-size:calc(var(--u)*.9*max(var(--k),.8));margin-top:calc(var(--u)*.45);}
  .meta .linha1{display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--u)*.8);}
  .meta .pct{white-space:nowrap;font-size:calc(var(--u)*4.4*var(--k));font-weight:800;line-height:.95;}
  .meta .pct small{font-size:.5em;margin-left:.06em;color:var(--tinta-2);}
  .meta .pct.batida{color:var(--ok);}
  .barra{position:relative;height:calc(var(--u)*1.05*var(--k));background:#2A2924;border-radius:999px;overflow:hidden;margin:calc(var(--u)*.55) 0 calc(var(--u)*.45);}
  .barra i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#C99F05,var(--ouro) 60%,var(--ouro-2));transition:width 1s ease;}
  .barra i.batida{background:linear-gradient(90deg,#2F8F52,var(--ok));}
  .meta .detalhe{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 calc(var(--u)*.8);color:var(--tinta-2);font-size:calc(var(--u)*.95*max(var(--k),.8));}
  .meta .detalhe span{white-space:nowrap;}
  .meta .detalhe b{color:var(--tinta);font-weight:700;}
  .sem-meta{color:var(--aco);font-size:calc(var(--u)*max(var(--k),.8));border:1px dashed var(--linha);border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.8) calc(var(--u)*1);}
  .sem-meta b{white-space:nowrap;color:var(--tinta);display:block;font-size:calc(var(--u)*1.6*var(--k));font-family:"Big Shoulders Display",sans-serif;font-weight:800;}

  .grafico{display:flex;flex-direction:column;min-height:0;}
  .grafico .rot{display:flex;justify-content:space-between;margin-bottom:calc(var(--u)*.5);}
  .barras{flex:1;min-height:0;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--linha);}
  .barras span{flex:1;min-width:1px;border-radius:3px 3px 0 0;background:#4A4840;position:relative;}
  .barras span.vazio{background:transparent;}
  .barras span.futuro{background:transparent;border-bottom:2px dotted #34322C;}
  .barras span.hoje{background:var(--ouro);box-shadow:0 0 calc(var(--u)*.8) rgba(238,197,18,.45);}
  .sem-lanc{align-self:center;margin:auto;color:var(--aco);font-style:normal;font-size:calc(var(--u)*.95*max(var(--k),.8));}
  .eixo{display:flex;justify-content:space-between;color:var(--aco);font-size:calc(var(--u)*.72);margin-top:calc(var(--u)*.3);font-variant-numeric:tabular-nums;}

  footer{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);border-top:1px solid var(--linha);padding-top:calc(var(--u)*1);}
  .totais{display:flex;gap:calc(var(--u)*3);}
  .totais div b{display:block;font:800 calc(var(--u)*2)/1 "Big Shoulders Display",sans-serif;font-variant-numeric:tabular-nums;margin-top:calc(var(--u)*.25);}
  .estado{display:flex;align-items:center;gap:calc(var(--u)*1.4);color:var(--aco);font-size:calc(var(--u)*.9);}
  .estado .ponto{display:inline-block;width:calc(var(--u)*.7);height:calc(var(--u)*.7);border-radius:50%;background:var(--ok);margin-right:calc(var(--u)*.45);vertical-align:middle;}
  .estado .ponto.off{background:var(--alerta);}
  .paginas{display:flex;gap:calc(var(--u)*.4);}
  .paginas i{width:calc(var(--u)*.6);height:calc(var(--u)*.6);border-radius:50%;background:var(--linha);}
  .paginas i.on{background:var(--ouro);}

  .vazio-geral{grid-column:1/-1;display:grid;place-items:center;text-align:center;color:var(--tinta-2);font-size:calc(var(--u)*1.3);}
  .vazio-geral b{display:block;font:800 calc(var(--u)*2.6)/1.1 "Big Shoulders Display",sans-serif;color:var(--tinta);text-transform:uppercase;margin-bottom:calc(var(--u)*.6);}

  /* ---------- menu (aparece ao mexer o mouse) ---------- */
  #menu{position:fixed;right:calc(var(--u)*2);top:calc(var(--u)*7.5);display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .25s;}
  body:not(.ocioso) #menu{opacity:1;pointer-events:auto;}
  .bt{font:600 14px Inter,sans-serif;color:var(--tinta);background:#26251F;border:1px solid var(--linha);border-radius:10px;padding:9px 14px;cursor:pointer;}
  .bt:hover{border-color:var(--ouro);}
  .bt:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;}
  .bt.ouro{background:linear-gradient(180deg,#F5D43C,#E3B708);color:#1C1B18;border-color:#D4A90A;}

  /* ---------- entrada ---------- */
  #entrada{position:fixed;inset:0;display:grid;place-items:center;padding:16px;
    background:radial-gradient(800px 420px at 15% 10%, rgba(238,197,18,.14), transparent 60%), linear-gradient(160deg,#1E1D1A,#0F0F0D);}
  #entrada form{width:min(420px,100%);background:#1A1A17;border:1px solid var(--linha);border-radius:20px;padding:34px 30px 28px;display:grid;gap:14px;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.8);font-size:15px;}
  #entrada img{height:34px;justify-self:start;}
  #entrada h1{font:800 30px/1 "Big Shoulders Display",sans-serif;text-transform:uppercase;letter-spacing:.03em;margin-top:6px;}
  #entrada p{color:var(--tinta-2);font-size:14px;}
  #entrada label{font:700 11px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--aco);display:block;margin-bottom:6px;}
  #entrada input{width:100%;font:500 16px Inter,sans-serif;color:var(--tinta);background:#0F0F0D;border:1px solid var(--linha);border-radius:10px;padding:11px 12px;}
  #entrada input:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px rgba(238,197,18,.25);}
  .escolha-tv{display:flex;gap:8px;}
  .escolha-tv button{flex:1;}
  .escolha-tv button[aria-pressed="true"]{background:linear-gradient(180deg,#F5D43C,#E3B708);color:#1C1B18;border-color:#D4A90A;}
  #erro{color:#F08A84;font-size:14px;min-height:1em;}
  #entrada .bt.ouro{padding:12px;font-size:15px;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){ .obra{animation:none;} .barra i{transition:none;} }
</style>
</head>
<body>

<div id="entrada" hidden>
  <form id="formEntrada" autocomplete="on">
    <img data-logo alt="Venko">
    <h1>Painel das obras</h1>
    <p>Entre com a conta da TV. Ela fica conectada nesta tela — não precisa entrar de novo.</p>
    <div><label for="login">Usuário</label><input id="login" name="username" autocomplete="username" required></div>
    <div><label for="senha">Senha</label><input id="senha" name="password" type="password" autocomplete="current-password" required></div>
    <div><label>Esta tela é a</label><div class="escolha-tv" id="escolhaTv"></div></div>
    <div id="erro" role="alert"></div>
    <button class="bt ouro" type="submit" id="btEntrar">Entrar</button>
  </form>
</div>

<div id="painel" hidden>
  <header>
    <div class="marca">
      <img data-logo alt="Venko">
      <div class="tv"><span class="rot">Painel das obras</span><b id="tvNome">TV 1</b></div>
    </div>
    <div class="relogio"><div class="hora num" id="hora">--:--</div><div class="data" id="data"></div></div>
  </header>
  <main id="grade"></main>
  <footer>
    <div class="totais">
      <div><span class="rot">Total hoje</span><b id="totHoje">—</b></div>
      <div><span class="rot">Total do mês</span><b id="totMes">—</b></div>
      <div><span class="rot">Meta do mês</span><b id="totMeta">—</b></div>
      <div><span class="rot">Atingido</span><b id="totPct">—</b></div>
    </div>
    <div class="estado"><div class="paginas" id="paginas"></div><span id="status"><span class="ponto"></span>Carregando…</span></div>
  </footer>
</div>

<div id="menu" hidden>
  <button class="bt" type="button" id="btTela">Tela cheia</button>
  <button class="bt" type="button" id="btTroca">Trocar para TV 2</button>
  <button class="bt" type="button" id="btSair">Sair</button>
</div>

  document.querySelectorAll('img[data-logo]').forEach(function(i){ i.src = LOGO; });
  var sb = (typeof CONFIG_OK!=='undefined' && CONFIG_OK && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  var $ = function(id){ return document.getElementById(id); };
  var guarda = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

  var params = new URLSearchParams(location.search);
  var tv = parseInt(params.get('tv') || guarda.get('vk_tv') || '1', 10);
  if(!(tv>=1 && tv<=9)) tv = 1;
  guarda.set('vk_tv', String(tv));

  var dados = null, ultimaOk = null, pagina = 0, timerDados = null, timerPagina = null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function reais(v){ return 'R$ ' + Math.round(Number(v)||0).toLocaleString('pt-BR'); }
  function dm(iso){ if(!iso) return ''; var p = String(iso).split('-'); return p[2]+'/'+p[1]; }
  function hhmm(d){ return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }

  // ---------- relógio ----------
  function relogio(){
    var d = new Date();
    $('hora').textContent = hhmm(d);
    $('data').textContent = d.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  }

  // ---------- entrada ----------
  function montaEscolhaTv(){
    var h = '';
    for(var i=1;i<=TVS;i++) h += '<button type="button" class="bt" data-tv="'+i+'" aria-pressed="'+(i===tv)+'">TV '+i+'</button>';
    $('escolhaTv').innerHTML = h;
    $('escolhaTv').querySelectorAll('[data-tv]').forEach(function(b){
      b.addEventListener('click', function(){ tv = +b.getAttribute('data-tv'); guarda.set('vk_tv', String(tv)); montaEscolhaTv(); });
    });
  }
  function mostraEntrada(msg){
    $('painel').hidden = true; $('menu').hidden = true; $('entrada').hidden = false;
    montaEscolhaTv(); $('erro').textContent = msg || '';
    pararTimers();
  }
  $('formEntrada').addEventListener('submit', function(e){
    e.preventDefault();
    if(!sb){ $('erro').textContent = 'Configuração do sistema não encontrada.'; return; }
    var login = String($('login').value||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
    var senha = $('senha').value;
    $('btEntrar').disabled = true; $('erro').textContent = '';
    sb.auth.signInWithPassword({ email: login + '@' + LOGIN_DOMAIN, password: senha }).then(function(res){
      $('btEntrar').disabled = false;
      if(res.error){ $('erro').textContent = 'Usuário ou senha incorretos.'; return; }
      $('senha').value = '';
      iniciaPainel();
    }, function(){ $('btEntrar').disabled = false; $('erro').textContent = 'Sem conexão com a internet.'; });
  });

  // ---------- painel ----------
  function iniciaPainel(){
    $('entrada').hidden = true; $('painel').hidden = false; $('menu').hidden = false;
    $('tvNome').textContent = 'TV ' + tv;
    $('btTroca').textContent = 'Trocar para TV ' + (tv % TVS + 1);
    history.replaceState(null, '', location.pathname + '?tv=' + tv);
    pedeTelaAcesa();
    buscar();
    pararTimers();
    timerDados = setInterval(buscar, ATUALIZA_MS);
    timerPagina = setInterval(function(){ if(dados && dados.obras.length > POR_PAGINA){ pagina++; desenha(); } }, PAGINA_MS);
  }
  function pararTimers(){ clearInterval(timerDados); clearInterval(timerPagina); }

  function buscar(){
    sb.rpc('vk_painel_tv', { p_tv: tv }).then(function(res){
      if(res.error){
        if(res.error.code === '42501') { mostraEntrada('Esta conta não tem acesso ao painel. Peça ao administrador para marcar a conta como "conta do painel da TV".'); sb.auth.signOut(); return; }
        if(/JWT|token|auth/i.test(res.error.message||'')){ mostraEntrada('A sessão expirou. Entre de novo.'); return; }
        estado(false); return;
      }
      dados = res.data || { obras: [] }; ultimaOk = new Date();
      estado(true); desenha();
    }, function(){ estado(false); });
  }
  function estado(ok){
    $('status').innerHTML = ok
      ? '<span class="ponto"></span>Atualizado às ' + hhmm(ultimaOk)
      : '<span class="ponto off"></span>Sem conexão' + (ultimaOk ? ' — números de ' + hhmm(ultimaOk) : '');
  }

  function colunas(n){ return n<=1 ? [1,1] : n===2 ? [2,1] : n<=4 ? [2,2] : [3,2]; }

  function desenha(){
    var obras = (dados && dados.obras) || [];
    var grade = $('grade');
    // totais da TV
    var tHoje = 0, tMes = 0, tMeta = 0, tMesComMeta = 0;
    obras.forEach(function(o){ tHoje += +o.hoje||0; tMes += +o.mes||0; if(o.meta>0){ tMeta += +o.meta; tMesComMeta += +o.mes||0; } });
    $('totHoje').textContent = reais(tHoje);
    $('totMes').textContent = reais(tMes);
    $('totMeta').textContent = tMeta>0 ? reais(tMeta) : '—';
    $('totPct').textContent = tMeta>0 ? Math.floor(tMesComMeta / tMeta * 100) + '%' : '—';

    if(!obras.length){
      grade.style.gridTemplateColumns = '1fr'; grade.style.gridTemplateRows = '1fr';
      grade.innerHTML = '<div class="vazio-geral"><div><b>Nenhuma obra nesta TV</b>No sistema, em Obras, escolha “TV '+tv+'” no campo “Painel da TV” de cada obra.</div></div>';
      $('paginas').innerHTML = ''; return;
    }
    var paginas = Math.ceil(obras.length / POR_PAGINA);
    pagina = pagina % paginas;
    var vis = obras.slice(pagina*POR_PAGINA, pagina*POR_PAGINA + POR_PAGINA);
    var c = colunas(paginas > 1 ? POR_PAGINA : vis.length);
    grade.style.gridTemplateColumns = 'repeat('+c[0]+', minmax(0,1fr))';
    grade.style.gridTemplateRows = 'repeat('+c[1]+', minmax(0,1fr))';
    grade.className = (c[0]*c[1] >= 6) ? 'p' : (c[0]*c[1] >= 4 ? 'm' : '');
    grade.innerHTML = vis.map(cartao).join('');
    $('paginas').innerHTML = paginas > 1 ? Array.apply(null, Array(paginas)).map(function(_, i){ return '<i class="'+(i===pagina?'on':'')+'"></i>'; }).join('') : '';
  }

  function cartao(o){
    var hoje = +o.hoje || 0, mes = +o.mes || 0, meta = +o.meta || 0;
    var dias = o.dias || [];
    // observação embaixo do valor do dia
    var obs = '';
    if(hoje > 0) obs = (o.rdos_hoje||0) + ' RDO' + ((o.rdos_hoje||0)===1?'':'s') + ' hoje';
    else {
      var ult = null; for(var i=dias.length-1;i>=0;i--){ if(+dias[i][1] > 0){ ult = dias[i]; break; } }
      obs = (o.rdos_hoje ? 'RDO de hoje sem serviços lançados' : 'Nenhum RDO hoje ainda') + (ult ? ' · último: ' + dm(ult[0]) + ' ' + reais(ult[1]) : '');
    }
    // meta
    var blocoMeta;
    if(meta > 0){
      var pct = Math.floor(mes / meta * 100), batida = mes >= meta;
      var falta = Math.max(0, meta - mes);
      blocoMeta = '<div class="meta">'+
        '<div class="linha1"><span class="rot">Meta do mês</span><span class="pct num'+(batida?' batida':'')+'">'+pct+'<small>%</small></span></div>'+
        '<div class="barra" role="img" aria-label="'+pct+'% da meta"><i class="'+(batida?'batida':'')+'" style="width:'+Math.min(100, mes/meta*100).toFixed(1)+'%"></i></div>'+
        '<div class="detalhe"><span><b>'+reais(mes)+'</b> de '+reais(meta)+'</span><span>'+(batida ? 'Meta batida' : 'Faltam <b>'+reais(falta)+'</b>')+'</span></div>'+
      '</div>';
    } else {
      blocoMeta = '<div class="sem-meta"><span class="rot">Medido no mês</span><b>'+reais(mes)+'</b>Meta do mês não definida</div>';
    }
    // gráfico dia a dia (o mês inteiro; dias que ainda não chegaram ficam pontilhados)
    var ini = dados.inicio_mes, hojeIso = dados.hoje;
    var p = String(ini).split('-'), ano = +p[0], mesN = +p[1];
    var nDias = new Date(ano, mesN, 0).getDate();
    var porDia = {}; dias.forEach(function(d){ porDia[d[0]] = +d[1] || 0; });
    var max = 0; dias.forEach(function(d){ if(+d[1] > max) max = +d[1]; });
    var barras = '';
    for(var dd=1; dd<=nDias; dd++){
      var iso = ano + '-' + String(mesN).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
      if(iso > hojeIso){ barras += '<span class="futuro" style="height:0"></span>'; continue; }
      var v = porDia[iso] || 0;
      var h = max > 0 ? Math.max(v > 0 ? 4 : 0, v / max * 100) : 0;
      barras += '<span class="'+(iso===hojeIso?'hoje':'')+(v===0&&iso!==hojeIso?' vazio':'')+'" style="height:'+h.toFixed(1)+'%" title="'+dm(iso)+': '+reais(v)+'"></span>';
    }
    return '<section class="obra">'+
      '<div class="obra-topo"><div class="obra-nome" title="'+esc(o.nome)+'">'+esc(o.nome)+'</div>'+(o.cliente ? '<div class="obra-cli">'+esc(o.cliente)+'</div>' : '')+'</div>'+
      '<div class="numeros">'+
        '<div class="hoje"><span class="rot">Valor de hoje</span><div class="valor num'+(hoje>0?'':' zero')+'">'+reais(hoje)+'</div><div class="obs">'+esc(obs)+'</div></div>'+
        blocoMeta+
      '</div>'+
      '<div class="grafico"><div class="rot"><span>Dia a dia — '+MESES[mesN-1]+'</span><span>maior dia '+reais(max)+'</span></div>'+
        '<div class="barras">'+(max>0 ? barras : '<em class="sem-lanc">Nenhum serviço lançado nos RDOs deste mês ainda</em>')+'</div><div class="eixo"><span>1</span><span>'+Math.ceil(nDias/2)+'</span><span>'+nDias+'</span></div></div>'+
    '</section>';
  }

  // ---------- tela sempre acesa, tela cheia, cursor ----------
  var trava = null;
  function pedeTelaAcesa(){
    try{ if('wakeLock' in navigator && !trava) navigator.wakeLock.request('screen').then(function(l){ trava = l; l.addEventListener('release', function(){ trava = null; }); }, function(){}); }catch(e){}
  }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && !$('painel').hidden){ pedeTelaAcesa(); buscar(); } });
  var ocioso = null;
  function acorda(){ document.body.classList.remove('ocioso'); clearTimeout(ocioso); ocioso = setTimeout(function(){ document.body.classList.add('ocioso'); }, 3000); }
  ['mousemove','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, acorda, {passive:true}); });
  acorda();
  $('btTela').addEventListener('click', function(){
    if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  });
  document.addEventListener('fullscreenchange', function(){ $('btTela').textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia'; });
  $('btTroca').addEventListener('click', function(){ tv = tv % TVS + 1; guarda.set('vk_tv', String(tv)); pagina = 0; dados = null; iniciaPainel(); });
  $('btSair').addEventListener('click', function(){ sb.auth.signOut().then(function(){ mostraEntrada(''); }); });

  // recarrega a página a cada 6 horas (pega versões novas e evita a TV ficar lenta)
  setTimeout(function(){ location.reload(); }, 6 * 60 * 60 * 1000);
  relogio(); setInterval(relogio, 5000);

  if(!sb){ mostraEntrada('Configuração do sistema não encontrada.'); return; }
  sb.auth.getSession().then(function(r){ if(r && r.data && r.data.session) iniciaPainel(); else mostraEntrada(''); }, function(){ mostraEntrada(''); });
})();
</script>
</body>
</html>
